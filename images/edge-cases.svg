<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Poppins, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1118"/>
      <stop offset="1" stop-color="#0a1512"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131b24"/>
      <stop offset="1" stop-color="#0f1720"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- panel -->
  <rect x="56" y="52" width="688" height="396" rx="18" fill="url(#panel)" stroke="#232e3a" stroke-width="1"/>

  <!-- header -->
  <text x="88" y="98" fill="#eef3f8" font-size="24" font-weight="600" letter-spacing="-0.4">States covered</text>
  <text x="88" y="124" fill="#7f8b98" font-size="13.5">Every boring-but-critical screen, designed on purpose.</text>
  <circle cx="626" cy="90" r="4" fill="#2ee59d"/>
  <text x="640" y="94" fill="#8b96a2" font-size="11.5" letter-spacing="1.4">COVERED</text>

  <line x1="88" y1="150" x2="712" y2="150" stroke="#212c38" stroke-width="1"/>

  <!-- rows -->
  <!-- Row 1 Empty -->
  <g transform="translate(0,184)">
    <circle cx="100" cy="0" r="11" fill="#2ee59d" fill-opacity="0.16" stroke="#2ee59d" stroke-opacity="0.5"/>
    <path d="M95 0 L99 4 L106 -4" fill="none" stroke="#2ee59d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="126" y="-2" fill="#e7edf3" font-size="15.5" font-weight="600">Empty</text>
    <text x="126" y="16" fill="#7c8794" font-size="12.5">&#8220;No consignments yet &#8212; book your first&#8221;</text>
    <rect x="612" y="-13" width="100" height="26" rx="13" fill="#7d8794" fill-opacity="0.14"/>
    <text x="662" y="4" fill="#9aa4b0" font-size="10.5" font-weight="600" letter-spacing="1.2" text-anchor="middle">EMPTY</text>
  </g>

  <!-- Row 2 Loading -->
  <g transform="translate(0,236)">
    <circle cx="100" cy="0" r="11" fill="#2ee59d" fill-opacity="0.16" stroke="#2ee59d" stroke-opacity="0.5"/>
    <path d="M95 0 L99 4 L106 -4" fill="none" stroke="#2ee59d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="126" y="-2" fill="#e7edf3" font-size="15.5" font-weight="600">Loading</text>
    <text x="126" y="16" fill="#7c8794" font-size="12.5">Skeleton rows while the data comes in</text>
    <rect x="612" y="-13" width="100" height="26" rx="13" fill="#60a5fa" fill-opacity="0.14"/>
    <text x="662" y="4" fill="#7fb4ff" font-size="10.5" font-weight="600" letter-spacing="1.2" text-anchor="middle">LOADING</text>
  </g>

  <!-- Row 3 Error -->
  <g transform="translate(0,288)">
    <circle cx="100" cy="0" r="11" fill="#2ee59d" fill-opacity="0.16" stroke="#2ee59d" stroke-opacity="0.5"/>
    <path d="M95 0 L99 4 L106 -4" fill="none" stroke="#2ee59d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="126" y="-2" fill="#e7edf3" font-size="15.5" font-weight="600">Error</text>
    <text x="126" y="16" fill="#7c8794" font-size="12.5">&#8220;Couldn&#8217;t reach the server &#8212; retry&#8221;</text>
    <rect x="612" y="-13" width="100" height="26" rx="13" fill="#f43f5e" fill-opacity="0.14"/>
    <text x="662" y="4" fill="#fb7185" font-size="10.5" font-weight="600" letter-spacing="1.2" text-anchor="middle">ERROR</text>
  </g>

  <!-- Row 4 Offline -->
  <g transform="translate(0,340)">
    <circle cx="100" cy="0" r="11" fill="#2ee59d" fill-opacity="0.16" stroke="#2ee59d" stroke-opacity="0.5"/>
    <path d="M95 0 L99 4 L106 -4" fill="none" stroke="#2ee59d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="126" y="-2" fill="#e7edf3" font-size="15.5" font-weight="600">Offline</text>
    <text x="126" y="16" fill="#7c8794" font-size="12.5">&#8220;You&#8217;re offline &#8212; changes will sync&#8221;</text>
    <rect x="612" y="-13" width="100" height="26" rx="13" fill="#fbbf24" fill-opacity="0.14"/>
    <text x="662" y="4" fill="#fcd34d" font-size="10.5" font-weight="600" letter-spacing="1.2" text-anchor="middle">OFFLINE</text>
  </g>

  <!-- Row 5 Success -->
  <g transform="translate(0,392)">
    <circle cx="100" cy="0" r="11" fill="#2ee59d" fill-opacity="0.16" stroke="#2ee59d" stroke-opacity="0.5"/>
    <path d="M95 0 L99 4 L106 -4" fill="none" stroke="#2ee59d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="126" y="-2" fill="#e7edf3" font-size="15.5" font-weight="600">Success</text>
    <text x="126" y="16" fill="#7c8794" font-size="12.5">&#8220;Booking confirmed &#8212; AWB generated&#8221;</text>
    <rect x="612" y="-13" width="100" height="26" rx="13" fill="#2ee59d" fill-opacity="0.16"/>
    <text x="662" y="4" fill="#2ee59d" font-size="10.5" font-weight="600" letter-spacing="1.2" text-anchor="middle">SUCCESS</text>
  </g>

  <line x1="88" y1="420" x2="712" y2="420" stroke="#212c38" stroke-width="1"/>
  <text x="400" y="440" fill="#69747f" font-size="12" text-anchor="middle">Enumerated with Claude &#183; written &amp; refined by hand</text>
</svg>
